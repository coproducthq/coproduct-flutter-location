name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title is a Conventional Commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          if ! [[ "$TITLE" =~ ^(feat|fix|chore|docs|refactor|test|perf|style|build|ci)(\([a-z0-9_-]+\))?!?:\ .+ ]]; then
            printf '::error::PR title %q is not a Conventional Commit (feat:, fix:, chore:, ...). Merges squash, so this title becomes the release commit and decides the version bump.\n' "$TITLE"
            exit 1
          fi

  test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.7
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example

  publish-dry-run:
    name: Verify the package would publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.7
      - run: flutter pub get
      - run: dart pub publish --dry-run
