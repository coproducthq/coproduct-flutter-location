name: coproduct_location
description: "Opt-in GPS geo-fence location for the Coproduct Flutter SDK. Depend on this only if you use geo-fence targeting, so apps that just read flags carry no location-permission code."
version: 0.1.1
homepage: https://coproduct.app
repository: https://github.com/coproducthq/coproduct-flutter-location
issue_tracker: https://github.com/coproducthq/coproduct-flutter-location/issues
topics:
  - feature-flags
  - geofencing
  - location
  - targeting

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  # This package only calls updateAttributes and AttributeValue, both stable
  # on pub.dev today, so it does not need to wait for the in-flight
  # geolocator-free coproduct release before depending on a hosted version
  coproduct: ^1.3.0
  geolocator: ">=13.0.1 <15.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
